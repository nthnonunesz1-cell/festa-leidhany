<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF2E4">
<title>Leidhany Faz 47 · Foto da Festa</title>
<link rel="preload" href="permanent-marker.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Permanent Marker";
    src: url("permanent-marker.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    --papel: #FCF2E4;
    --rosa: #E8177D;
    --rosa-escuro: #B80E5F;
    --amarelo: #FFE11A;
    --ciano: #22C1D6;
    --tinta: #141414;
    --branco: #FFFFFF;
    --noite: #2A1B3D;
    --texto-suave: #5B4F45;
    --marcador: "Permanent Marker", "Comic Sans MS", cursive;
    --sistema: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--papel);
    color: var(--tinta);
    font-family: var(--sistema);
    overscroll-behavior: none;
  }

  body {
    background-image:
      radial-gradient(circle at 12% 18%, rgba(232, 23, 125, .10) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 62%, rgba(34, 193, 214, .12) 0 2px, transparent 3px),
      radial-gradient(circle at 42% 88%, rgba(255, 225, 26, .22) 0 2px, transparent 3px);
    background-size: 90px 90px, 120px 120px, 70px 70px;
  }

  button { font: inherit; color: inherit; cursor: pointer; }

  .tela {
    display: none;
    min-height: 100vh;
    min-height: 100svh;
    flex-direction: column;
    align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  }
  .tela.ativa { display: flex; }

  /* ---------- Início ---------- */
  #inicio { justify-content: center; gap: 22px; text-align: center; }

  .capa {
    position: relative;
    width: min(60vw, 250px);
    aspect-ratio: 2 / 3;
    border: 3px solid var(--tinta);
    border-radius: 16px;
    overflow: hidden;
    background: var(--noite);
    box-shadow: 7px 7px 0 var(--tinta);
    transform: rotate(-3deg);
    margin-bottom: 8px;
  }
  .capa canvas { display: block; width: 100%; height: 100%; }
  .capa::after {
    content: "você aqui!";
    position: absolute;
    left: 50%; top: 58%;
    transform: translate(-50%, -50%) rotate(4deg);
    font-family: var(--marcador);
    font-size: 21px;
    color: var(--rosa);
    background: var(--branco);
    border: 2.5px dashed var(--rosa);
    border-radius: 999px;
    padding: 8px 16px;
    white-space: nowrap;
  }

  h1 {
    font-family: var(--marcador);
    font-weight: 400;
    font-size: clamp(28px, 8vw, 38px);
    line-height: 1.05;
    margin: 0;
  }
  h1 .marca { background: var(--amarelo); padding: 0 .18em; white-space: nowrap; }

  .sub { margin: 0; max-width: 32ch; font-size: 16px; line-height: 1.45; color: var(--texto-suave); }
  .miudo { margin: 0; max-width: 34ch; font-size: 13px; line-height: 1.4; color: var(--texto-suave); }

  .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px;
    padding: 0 26px;
    border: 3px solid var(--tinta);
    border-radius: 999px;
    background: var(--rosa);
    color: var(--branco);
    font-family: var(--marcador);
    font-size: 21px;
    letter-spacing: .5px;
    box-shadow: 4px 4px 0 var(--tinta);
    transition: transform .08s, box-shadow .08s;
    text-decoration: none;
  }
  .botao:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--tinta); }
  .botao.secundario { background: var(--branco); color: var(--tinta); }
  .botao.amarelo { background: var(--amarelo); color: var(--tinta); }
  .botao[disabled] { opacity: .55; pointer-events: none; }
  .botao svg { width: 22px; height: 22px; flex: none; }

  .erro {
    display: none;
    max-width: 34ch;
    background: var(--branco);
    border: 2.5px solid var(--tinta);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.45;
    text-align: left;
    box-shadow: 4px 4px 0 var(--rosa);
  }
  .erro.visivel { display: block; }
  .erro b { color: var(--rosa-escuro); }

  /* ---------- Palco (câmera e resultado) ---------- */
  .palco {
    --resto: 210px;
    position: relative;
    width: min(calc(100vw - 24px), calc((100vh - var(--resto)) * 2 / 3), 560px);
    width: min(calc(100vw - 24px), calc((100svh - var(--resto)) * 2 / 3), 560px);
    aspect-ratio: 2 / 3;
    border: 3px solid var(--tinta);
    border-radius: 18px;
    overflow: hidden;
    background: var(--noite);
    box-shadow: 5px 5px 0 var(--tinta);
    flex: none;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }
  .palco video, .palco canvas, .palco img {
    position: absolute; inset: 0;
    display: block; width: 100%; height: 100%;
  }
  .palco video {
    object-fit: cover;
    object-position: 50% 40%;   /* igual ao corte da foto final */
  }
  .palco video.espelhado { transform: scaleX(-1); }
  .palco canvas { pointer-events: none; }
  .palco img { -webkit-touch-callout: default; }

  .contagem {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--marcador);
    font-size: 150px;
    color: var(--branco);
    -webkit-text-stroke: 5px var(--tinta);
    paint-order: stroke fill;
    pointer-events: none;
    opacity: 0;
  }
  .contagem.pulso { animation: pulso .8s ease-out; }
  @keyframes pulso {
    0% { opacity: 0; transform: scale(1.6); }
    25% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(.85); }
  }

  .flash { position: absolute; inset: 0; background: var(--branco); opacity: 0; pointer-events: none; }
  .flash.dispara { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  /* luz de tela: a tela inteira fica branca para iluminar o rosto no escuro */
  .luz {
    position: fixed; inset: 0;
    background: #FFF8EF;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity .35s ease-out;
  }
  .luz.acesa { opacity: 1; transition: none; }

  /* ---------- Barra de frases ---------- */
  .frases {
    display: flex; align-items: center; gap: 8px;
    width: min(100%, 560px);
    margin-top: 12px;
  }
  .frase-atual {
    flex: 1; min-width: 0;
    height: 46px;
    padding: 0 10px;
    line-height: 41px;
    text-align: center;
    background: var(--branco);
    border: 2.5px solid var(--tinta);
    border-radius: 12px;
    font-family: var(--marcador);
    font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icone {
    position: relative;
    flex: none;
    width: 46px; height: 46px;
    display: grid; place-items: center;
    background: var(--branco);
    border: 2.5px solid var(--tinta);
    border-radius: 12px;
    box-shadow: 3px 3px 0 var(--tinta);
    padding: 0;
  }
  .icone:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tinta); }
  .icone svg { width: 22px; height: 22px; }
  .icone.dado { background: var(--amarelo); }

  /* ---------- Controles da câmera ---------- */
  .controles {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: min(100%, 360px);
    margin-top: 14px;
  }
  .grupo { display: flex; gap: 10px; }
  .grupo.esq { justify-content: flex-start; }
  .grupo.dir { justify-content: flex-end; }
  .icone.redondo { width: 52px; height: 52px; border-radius: 50%; }
  .icone.ligado { background: var(--ciano); }
  .icone.luz-ligada { background: var(--amarelo); }

  .disparo {
    width: 82px; height: 82px;
    border-radius: 50%;
    border: 4px solid var(--tinta);
    background: var(--branco);
    padding: 7px;
    box-shadow: 4px 4px 0 var(--tinta);
  }
  .disparo span {
    display: block; width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--rosa);
    border: 3px solid var(--tinta);
  }
  .disparo:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--tinta); }
  .disparo[disabled] { opacity: .5; pointer-events: none; }

  /* ---------- Resultado ---------- */
  #resultado .palco { --resto: 300px; }
  .acoes {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    width: min(100%, 420px);
    margin-top: 14px;
  }
  .acoes .botao { min-height: 52px; font-size: 18px; padding: 0 14px; }
  .acoes .largo { grid-column: 1 / -1; }
  .dica { margin-top: 10px; text-align: center; }

  @media (min-width: 700px) and (min-height: 700px) {
    .palco { --resto: 230px; }
  }
</style>
</head>
<body>

<!-- ===================== TELA INICIAL ===================== -->
<section class="tela ativa" id="inicio">
  <div class="capa" aria-hidden="true"><canvas id="capa" width="500" height="750"></canvas></div>
  <h1>Entra na <span class="marca">foto da festa!</span></h1>
  <p class="sub">Tira uma foto com a moldura do aniversário da Leidhany e posta direto no Instagram ou no WhatsApp.</p>
  <button class="botao" id="btnAbrir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg>
    Abrir câmera
  </button>
  <div class="erro" id="erroInicio" role="alert"></div>
  <p class="miudo">O celular vai pedir permissão pra usar a câmera. A foto fica só no seu aparelho, nada é enviado pra lugar nenhum.</p>
</section>

<!-- ===================== CÂMERA ===================== -->
<section class="tela" id="camera">
  <div class="palco" id="palcoCamera">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="moldura" width="1024" height="1536" aria-label="Moldura da festa"></canvas>
    <div class="contagem" id="contagem"></div>
    <div class="flash" id="flash"></div>
  </div>

  <div id="vagaFrasesCamera" style="width:100%;display:flex;justify-content:center"></div>

  <div class="controles">
    <div class="grupo esq">
      <button class="icone redondo" id="btnVirar" aria-label="Trocar câmera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 0 0-14.3-3.6L4 8.5"/><path d="M4 4v4.5h4.5"/><path d="M4 14a8 8 0 0 0 14.3 3.6L20 15.5"/><path d="M20 20v-4.5h-4.5"/></svg>
      </button>
    </div>
    <button class="disparo" id="btnFoto" aria-label="Tirar foto"><span></span></button>
    <div class="grupo dir">
      <button class="icone redondo" id="btnLuz" aria-label="Luz de tela para foto no escuro" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      </button>
      <button class="icone redondo" id="btnTimer" aria-label="Timer de 3 segundos" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2"/><path d="M9.5 2.5h5"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- ===================== RESULTADO ===================== -->
<section class="tela" id="resultado">
  <div class="palco">
    <img id="fotoFinal" alt="Sua foto na festa da Leidhany">
  </div>

  <div id="vagaFrasesResultado" style="width:100%;display:flex;justify-content:center"></div>

  <div class="acoes">
    <button class="botao largo" id="btnCompartilhar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      Compartilhar
    </button>
    <a class="botao secundario" id="btnSalvar" download="festa-leidhany-47.jpg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Salvar
    </a>
    <button class="botao amarelo" id="btnOutra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Outra
    </button>
  </div>
  <p class="miudo dica" id="dica">Dá pra trocar a frase antes de postar.</p>
</section>

<!-- Barra de frases (é movida entre a câmera e o resultado) -->
<div class="frases" id="barraFrases">
  <button class="icone" id="btnFraseAnt" aria-label="Frase anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
  </button>
  <div class="frase-atual" id="fraseAtual" aria-live="polite"></div>
  <button class="icone" id="btnFraseProx" aria-label="Próxima frase">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
  </button>
  <button class="icone dado" id="btnFraseSorte" aria-label="Frase aleatória">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor"/></svg>
  </button>
</div>

<div class="luz" id="luz"></div>

<script>
(() => {
  "use strict";

  /* =========================================================
     CONFIGURAÇÃO — mexa aqui
     ========================================================= */
  const CONFIG = {
    frases: [
      "#ColaEmMimQueÉSucesso",
      "#LeidhanyFaz47",
      "47 e no auge!",
      "Vim pelo bolo, fiquei pela resenha",
      "Tô na festa da rainha!",
      "Aqui o isopor nunca esvazia",
      "#47ComTudoEmCima",
      "Resenha oficial dos 47",
    ],

    // Adesivos por cima da câmera, desenhados nesta ordem (o último fica por cima).
    // x e y = CENTRO do adesivo, em pixels da foto final (1024 x 1536).
    // largura = tamanho do adesivo (a altura acompanha). giro = inclinação em graus.
    adesivos: [
      { arquivo: "adesivo-faixa.webp",      x: 508, y: 1442, largura: 988 },
      { arquivo: "adesivo-isopor.webp",     x: 150, y: 1150, largura: 290 },
      { arquivo: "adesivo-coracao2.webp",   x: 968, y: 1210, largura: 80 },
      { arquivo: "adesivo-coracao1.webp",   x: 62,  y: 860,  largura: 72 },
      { arquivo: "adesivo-calendario.webp", x: 70,  y: 610,  largura: 120 },
      { arquivo: "adesivo-bolo.webp",       x: 948, y: 900,  largura: 165 },
      { arquivo: "adesivo-baloes.webp",     x: 900, y: 205,  largura: 250 },
      { arquivo: "adesivo-foto.webp",       x: 168, y: 215,  largura: 350 },
      { arquivo: "adesivo-titulo.webp",     x: 560, y: 228,  largura: 600 },
    ],

    // Centro e largura máxima da frase na faixa rosa de baixo (pixels da foto final).
    frase: { x: 512, y: 1440, larguraMax: 790, tamanhoMax: 66, tamanhoMin: 30 },

    // Luz de tela começa ligada? (a tela fica branca na hora da foto para clarear o rosto)
    luzLigadaNoInicio: false,

    nomeArquivo: "festa-leidhany-47",
    qualidadeJpeg: 0.92,
  };

  const LARG = 1024, ALT = 1536;
  const POSICAO_VERTICAL = 0.4;   // corte da câmera: 0 = topo, 0.5 = meio (igual ao object-position do CSS)

  /* ---------- elementos ---------- */
  const $ = (id) => document.getElementById(id);
  const video = $("video");
  const moldura = $("moldura");
  const ctxMoldura = moldura.getContext("2d");
  const telas = { inicio: $("inicio"), camera: $("camera"), resultado: $("resultado") };
  const barraFrases = $("barraFrases");

  /* ---------- estado ---------- */
  let stream = null;
  let frontal = true;
  let virada = "user";
  let timerLigado = false;
  let luzLigada = CONFIG.luzLigadaNoInicio;
  let capturando = false;
  let indiceFrase = 0;

  let fotoBlob = null;
  let fotoUrl = null;
  const fotoCamera = document.createElement("canvas");   // só a imagem da câmera, sem moldura
  fotoCamera.width = LARG; fotoCamera.height = ALT;
  const telaFinal = document.createElement("canvas");    // câmera + moldura
  telaFinal.width = LARG; telaFinal.height = ALT;
  const ctxFinal = telaFinal.getContext("2d");

  /* ---------- carregar adesivos e fonte ---------- */
  const carregarImagem = (src) => new Promise((ok) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => { console.warn("[festa] não carregou", src); ok(null); };
    img.src = src;
  });
  const imagens = new Map();
  const tudoPronto = Promise.all([
    ...CONFIG.adesivos.map((a) => carregarImagem(a.arquivo).then((img) => imagens.set(a.arquivo, img))),
    document.fonts ? document.fonts.load('60px "Permanent Marker"').catch(() => {}) : Promise.resolve(),
  ]);

  /* ---------- moldura (adesivos + frase) ---------- */
  function desenharMoldura(ctx, escala) {
    const s = escala || 1;
    ctx.clearRect(0, 0, LARG * s, ALT * s);
    for (const a of CONFIG.adesivos) {
      const img = imagens.get(a.arquivo);
      if (!img) continue;
      const w = a.largura * s;
      const h = w * (img.naturalHeight / img.naturalWidth);
      ctx.save();
      ctx.translate(a.x * s, a.y * s);
      if (a.giro) ctx.rotate((a.giro * Math.PI) / 180);
      ctx.shadowColor = "rgba(0, 0, 0, .35)";
      ctx.shadowBlur = 14 * s;
      ctx.shadowOffsetY = 4 * s;
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
    }
    desenharFrase(ctx, s, CONFIG.frases[indiceFrase]);
  }

  function desenharFrase(ctx, s, texto) {
    if (!texto) return;
    const f = CONFIG.frase;
    const larguraMax = f.larguraMax * s;
    const fonte = (t) => `${t * s}px "Permanent Marker", "Comic Sans MS", cursive`;

    let linhas = [texto];
    let tam = f.tamanhoMax;
    ctx.font = fonte(tam);
    while (ctx.measureText(texto).width > larguraMax && tam > f.tamanhoMin) {
      tam -= 2; ctx.font = fonte(tam);
    }
    // ainda não coube: quebra em duas linhas
    if (ctx.measureText(texto).width > larguraMax && texto.includes(" ")) {
      const meio = texto.length / 2;
      let corte = -1, melhor = Infinity;
      for (let i = 0; i < texto.length; i++) {
        if (texto[i] === " " && Math.abs(i - meio) < melhor) { melhor = Math.abs(i - meio); corte = i; }
      }
      linhas = [texto.slice(0, corte), texto.slice(corte + 1)];
      tam = Math.min(f.tamanhoMax * 0.72, 48);
      ctx.font = fonte(tam);
      const maior = () => Math.max(...linhas.map((l) => ctx.measureText(l).width));
      while (maior() > larguraMax && tam > 22) { tam -= 2; ctx.font = fonte(tam); }
    }

    ctx.save();
    ctx.translate(f.x * s, f.y * s);
    ctx.rotate(-0.025);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;
    const altura = tam * s * 1.02;
    const inicioY = -((linhas.length - 1) * altura) / 2;
    linhas.forEach((linha, i) => {
      const y = inicioY + i * altura;
      ctx.lineWidth = tam * s * 0.2;
      ctx.strokeStyle = "#141414";
      ctx.strokeText(linha, 0, y);
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(linha, 0, y);
    });
    ctx.restore();
  }

  // Miniatura da tela inicial: fundo de "festa à noite" com a moldura por cima
  function desenharCapa() {
    const c = $("capa");
    const ctx = c.getContext("2d");
    const s = c.width / LARG;
    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, "#3B2352");
    g.addColorStop(1, "#1C1328");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);
    const luzes = [["#E8177D", .2, .55], ["#22C1D6", .8, .62], ["#FFE11A", .55, .78], ["#E8177D", .7, .45], ["#22C1D6", .3, .82]];
    for (const [cor, x, y] of luzes) {
      const r = c.width * 0.16;
      const rg = ctx.createRadialGradient(x * c.width, y * c.height, 0, x * c.width, y * c.height, r);
      rg.addColorStop(0, cor + "88");
      rg.addColorStop(1, cor + "00");
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, c.width, c.height);
    }
    ctx.save();
    desenharMoldura(ctx, s);
    ctx.restore();
  }

  /* ---------- câmera ---------- */
  function pararStream() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }

  function mensagemErro(nome) {
    const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (nome === "inseguro") return "<b>O site precisa abrir com https.</b> Confira o endereço do link.";
    if (nome === "semSuporte") return "<b>Esse navegador não libera a câmera.</b> Se abriu pelo Instagram ou WhatsApp, toque nos três pontinhos e escolha abrir no " + (ios ? "Safari" : "Chrome") + ".";
    if (nome === "NotAllowedError" || nome === "SecurityError") {
      return ios
        ? "<b>A câmera foi bloqueada.</b> Toque no <b>aA</b> da barra de endereço → Ajustes do Site → Câmera → Permitir. Depois recarregue a página."
        : "<b>A câmera foi bloqueada.</b> Toque no cadeado ao lado do endereço → Permissões → Câmera → Permitir. Depois recarregue a página.";
    }
    if (nome === "NotFoundError" || nome === "OverconstrainedError") return "<b>Não achei a câmera desse aparelho.</b>";
    if (nome === "NotReadableError") return "<b>A câmera está sendo usada por outro app.</b> Feche o outro app e tente de novo.";
    return "<b>Não consegui abrir a câmera.</b> Recarregue a página e tente de novo.";
  }

  function mostrarErro(nome) {
    const caixa = $("erroInicio");
    caixa.innerHTML = mensagemErro(nome);
    caixa.classList.add("visivel");
    mostrarTela("inicio");
  }

  async function abrirCamera() {
    if (!window.isSecureContext) return mostrarErro("inseguro");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return mostrarErro("semSuporte");
    $("btnAbrir").disabled = true;
    pararStream();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: virada }, width: { ideal: 1920 }, height: { ideal: 1920 } },
      });
    } catch (e) {
      $("btnAbrir").disabled = false;
      return mostrarErro(e.name);
    }
    const trilha = stream.getVideoTracks()[0];
    const ajustes = trilha.getSettings ? trilha.getSettings() : {};
    frontal = ajustes.facingMode ? ajustes.facingMode === "user" : virada === "user";
    video.classList.toggle("espelhado", frontal);
    video.srcObject = stream;
    await tudoPronto;
    desenharMoldura(ctxMoldura);
    $("btnAbrir").disabled = false;
    $("erroInicio").classList.remove("visivel");
    mostrarTela("camera");
    try { await video.play(); } catch (e) { /* alguns iPhones só tocam depois do próximo toque */ }
    verificarCameras();
  }

  async function verificarCameras() {
    try {
      const lista = await navigator.mediaDevices.enumerateDevices();
      const qtd = lista.filter((d) => d.kind === "videoinput").length;
      $("btnVirar").style.visibility = qtd > 1 ? "visible" : "hidden";
    } catch (e) { /* ignora */ }
  }

  /* ---------- foto ---------- */
  const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));

  async function contagemRegressiva() {
    const el = $("contagem");
    for (const n of [3, 2, 1]) {
      el.textContent = n;
      el.classList.remove("pulso"); void el.offsetWidth; el.classList.add("pulso");
      await espera(850);
    }
    el.classList.remove("pulso");
  }

  // Copia o quadro atual da câmera, com o mesmo corte que aparece na tela
  function capturarQuadro() {
    const ctx = fotoCamera.getContext("2d");
    const vw = video.videoWidth, vh = video.videoHeight;
    const r = LARG / ALT;
    let sw = vw, sh = vw / r;
    if (sh > vh) { sh = vh; sw = vh * r; }
    const sx = (vw - sw) / 2;
    const sy = (vh - sh) * POSICAO_VERTICAL;
    ctx.save();
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, LARG, ALT);
    if (frontal) { ctx.translate(LARG, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, LARG, ALT);
    ctx.restore();
  }

  async function tirarFoto() {
    if (capturando) return;
    if (video.readyState < 2 || !video.videoWidth) { video.play().catch(() => {}); return; }
    capturando = true;
    $("btnFoto").disabled = true;
    if (timerLigado) await contagemRegressiva();

    if (luzLigada) {
      const luz = $("luz");
      luz.classList.add("acesa");
      await espera(550);            // dá tempo da câmera se ajustar à luz
      capturarQuadro();
      await espera(80);
      luz.classList.remove("acesa");
    } else {
      const fl = $("flash");
      fl.classList.remove("dispara"); void fl.offsetWidth; fl.classList.add("dispara");
      capturarQuadro();
    }

    await gerarFotoFinal();
    capturando = false;
    $("btnFoto").disabled = false;
    mostrarTela("resultado");
  }

  // Monta (ou remonta, quando troca a frase) a foto final e deixa o arquivo pronto
  let geracao = 0;
  async function gerarFotoFinal() {
    const minha = ++geracao;
    $("btnCompartilhar").disabled = true;
    ctxFinal.clearRect(0, 0, LARG, ALT);
    ctxFinal.drawImage(fotoCamera, 0, 0);
    ctxFinal.drawImage(moldura, 0, 0);
    const blob = await new Promise((ok) => telaFinal.toBlob(ok, "image/jpeg", CONFIG.qualidadeJpeg));
    if (minha !== geracao || !blob) return;
    if (fotoUrl) URL.revokeObjectURL(fotoUrl);
    fotoBlob = blob;
    fotoUrl = URL.createObjectURL(blob);
    $("fotoFinal").src = fotoUrl;
    const salvar = $("btnSalvar");
    salvar.href = fotoUrl;
    salvar.download = CONFIG.nomeArquivo + ".jpg";
    $("btnCompartilhar").disabled = false;
  }

  async function compartilhar() {
    if (!fotoBlob) return;
    const arquivo = new File([fotoBlob], CONFIG.nomeArquivo + ".jpg", { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      try { await navigator.share({ files: [arquivo] }); }
      catch (e) { if (e.name !== "AbortError") $("btnSalvar").click(); }
    } else {
      $("btnSalvar").click();
    }
  }

  function outraFoto() {
    mostrarTela("camera");
    if (video.paused) video.play().catch(() => {});
  }

  /* ---------- frases ---------- */
  function mostrarFrase() {
    $("fraseAtual").textContent = CONFIG.frases[indiceFrase] || "";
    desenharMoldura(ctxMoldura);
    if (telas.resultado.classList.contains("ativa")) gerarFotoFinal();
  }
  function mudarFrase(passo) {
    const n = CONFIG.frases.length;
    indiceFrase = (indiceFrase + passo + n) % n;
    mostrarFrase();
  }
  function fraseAleatoria() {
    const n = CONFIG.frases.length;
    if (n < 2) return;
    let novo;
    do { novo = Math.floor(Math.random() * n); } while (novo === indiceFrase);
    indiceFrase = novo;
    mostrarFrase();
  }

  // deslizar o dedo na prévia troca a frase; tocar na faixa de baixo também
  (function gestos() {
    const alvo = $("palcoCamera");
    let x0 = null, y0 = null;
    alvo.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; });
    alvo.addEventListener("pointerup", (e) => {
      if (x0 === null) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      const caixa = alvo.getBoundingClientRect();
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) mudarFrase(dx < 0 ? 1 : -1);
      else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && (e.clientY - caixa.top) / caixa.height > 0.86) mudarFrase(1);
      x0 = null;
    });
  })();

  /* ---------- telas ---------- */
  function mostrarTela(nome) {
    Object.entries(telas).forEach(([k, el]) => el.classList.toggle("ativa", k === nome));
    if (nome === "camera") $("vagaFrasesCamera").appendChild(barraFrases);
    if (nome === "resultado") $("vagaFrasesResultado").appendChild(barraFrases);
    barraFrases.style.display = nome === "inicio" ? "none" : "flex";
  }

  function atualizarBotaoLuz() {
    $("btnLuz").classList.toggle("luz-ligada", luzLigada);
    $("btnLuz").setAttribute("aria-pressed", String(luzLigada));
  }

  /* ---------- eventos ---------- */
  $("btnAbrir").addEventListener("click", abrirCamera);
  $("btnFoto").addEventListener("click", tirarFoto);
  $("btnTimer").addEventListener("click", () => {
    timerLigado = !timerLigado;
    $("btnTimer").classList.toggle("ligado", timerLigado);
    $("btnTimer").setAttribute("aria-pressed", String(timerLigado));
  });
  $("btnLuz").addEventListener("click", () => { luzLigada = !luzLigada; atualizarBotaoLuz(); });
  $("btnVirar").addEventListener("click", async () => {
    virada = virada === "user" ? "environment" : "user";
    await abrirCamera();
  });
  $("btnFraseAnt").addEventListener("click", () => mudarFrase(-1));
  $("btnFraseProx").addEventListener("click", () => mudarFrase(1));
  $("btnFraseSorte").addEventListener("click", fraseAleatoria);
  $("btnCompartilhar").addEventListener("click", compartilhar);
  $("btnOutra").addEventListener("click", outraFoto);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && video.srcObject && video.paused) video.play().catch(() => {});
  });

  /* ---------- começo ---------- */
  barraFrases.style.display = "none";
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    $("dica").textContent = "Dá pra trocar a frase antes de postar. Pra guardar na galeria: Compartilhar → Salvar imagem.";
  }
  atualizarBotaoLuz();
  $("fraseAtual").textContent = CONFIG.frases[indiceFrase] || "";
  tudoPronto.then(() => { desenharCapa(); desenharMoldura(ctxMoldura); });

  // atalho para testes e ajustes pelo console: window.festa
  window.festa = { CONFIG, redesenhar: () => { desenharMoldura(ctxMoldura); desenharCapa(); } };
})();
</script>
</body>
</html>
